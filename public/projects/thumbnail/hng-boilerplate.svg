<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      <rect x="6" y="6" width="48" height="48" rx="8" fill="none" stroke="#00E676" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <g opacity="0.9">
    <rect x="120" y="300" width="180" height="180" rx="16" fill="#00E676" fill-opacity="0.14" stroke="#00E676" stroke-width="2"/>
    <rect x="330" y="300" width="180" height="180" rx="16" fill="none" stroke="#DEDEDE" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="540" y="300" width="180" height="180" rx="16" fill="none" stroke="#DEDEDE" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <text x="120" y="220" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#DEDEDE" letter-spacing="1">HNG Boilerplate</text>
  <text x="120" y="270" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#B5B5B5">Open Source Frontend Starter</text>
</svg>
