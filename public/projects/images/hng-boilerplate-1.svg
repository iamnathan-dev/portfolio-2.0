<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="56" height="56" rx="10" fill="none" stroke="#00E676" stroke-opacity="0.1" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1500" height="800" fill="url(#bg)"/>
  <rect width="1500" height="800" fill="url(#grid)"/>
  <g opacity="0.9">
    <rect x="150" y="260" width="220" height="220" rx="20" fill="#00E676" fill-opacity="0.14" stroke="#00E676" stroke-width="2"/>
    <rect x="410" y="260" width="220" height="220" rx="20" fill="none" stroke="#DEDEDE" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="670" y="260" width="220" height="220" rx="20" fill="none" stroke="#DEDEDE" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <text x="150" y="180" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#DEDEDE" letter-spacing="1">HNG Boilerplate</text>
  <text x="150" y="230" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#B5B5B5">Reusable components &amp; design patterns</text>
</svg>
